function lineChart(series, labels, color="#111") {
  const W=900,H=300,p={l:48,r:20,t:20,b:38}, max=Math.max(...series)*1.12,min=Math.min(...series)*.92;
  const x=i=>p.l+i*(W-p.l-p.r)/(series.length-1), y=v=>p.t+(max-v)*(H-p.t-p.b)/(max-min||1);
  const pts=series.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="axis" x1="${p.l}" y1="${H-p.b}" x2="${W-p.r}" y2="${H-p.b}"/>
    <polyline class="line" points="${pts}" stroke="${color}"/>
    ${series.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="#8a949f">${labels[i]}</text>`).join("")}
  </svg>`;
}
function bars(rows, key, labelKey, color="#111"){
  // 使用 HTML/CSS 柱状图而非 SVG：避免浏览器缩放 viewBox 后中文和数字变小。
  const max=Math.max(...rows.map(x=>x[key]),1);
  return `<div class="hbars">
    ${rows.map((r,i)=>{
      const w=Math.max(1,(r[key]/max)*100);
      const label=String(r[labelKey]);
      return `<div class="hbar-row">
        <div class="hbar-label" title="${esc(label)}">${esc(label)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${color};opacity:${.92-i*.025}"></div></div>
        <div class="hbar-value">${fmt(r[key])}</div>
      </div>`;
    }).join("")}
  </div>`;
}

    <b>建议建立“人群 × 品类 × 平台”三维矩阵</b>例如：40+/50+营养包 × 稳定型平台；心脑健康 × 成熟用户；骨骼健康 × 中老年/关节关注人群。</div>
  </div>
  <div class="footer"><span>人群方向 · 明确区分源数据与推断</span><span>07</span></div>
</section>`,

`<section class="slide">

    ${D.topSkus.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.cat)}</td><td class="num">${fmt(r.gmv)}</td><td class="num">${fmt(r.lastGmv)}</td></tr>`).join("")}

      <div class="card"><h3>产品结构判断</h3>

      <div class="bullet"><b>第二层：鱼油/心脑健康</b><br>97%高纯鱼油是强单品，四倍鱼油等承担品类宽度。</div>
      <div class="bullet"><b>第三层：植提与基础维矿</b><br>具备稳定需求，但更适合作为连带购/补充型产品经营。</div>
      <div class="bullet"><b>第四层：长尾 SKU</b><br>应以明确的“引流 / 补充 / 人群覆盖 / 清库存”角色管理，而不是平均分配资源。</div>
      </div>
    </div>
  </div>
  <div class="footer"><span>产品趋势 · 头部集中度与角色分层</span><span>08</span></div>
</section>`,

`<section class="slide">
  <div class="kicker">08 / Inventory & Price</div><h2>真正影响下一阶段利润的，不只是销量，而是“销量 × 价格 × 库存”</h2>
  <div class="grid g2">
    <div class="card"><h3>当前库存覆盖较高的代表 SKU</h3><table><thead><tr><th>产品</th><th class="num">库存</th><th class="num">周销量</th><th class="num">约覆盖天数</th></tr></thead><tbody>
    ${D.stockRisk.slice(0,8).map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${r.lastStock.toLocaleString()}</td><td class="num">${r.lastSales.toLocaleString()}</td><td class="num ${r.stockDays>60?'bad':r.stockDays>30?'warn':'good'}">${Math.round(r.stockDays)}天</td></tr>`).join("")}

    <div>

      <p>① 高销量 + 低库存：优先保障供应，避免爆款断货。</p>
      <p>② 高销量 + 高库存：守价为主，通过平台扩量消化。</p>
      <p>③ 低销量 + 高库存：阶段性价格策略 / 组合销售 / 渠道清理。</p>

      <p class="note" style="margin-top:16px">源数据包含每周 begin / inbound / end / sales / GMV / unitPrice 等字段，因此可以继续向下做 SKU 级库存预警与价格弹性模型。</p>

</section>`,

`<section class="slide">

  </div>
  <div class="callout" style="margin-top:24px"><b>最终目标</b>不是把 GMV 做得更大，而是把“可持续 GMV”做得更大——降低节点依赖，提高核心 SKU 的稳定贡献，同时让库存和价格策略跟着需求变化。</div>
